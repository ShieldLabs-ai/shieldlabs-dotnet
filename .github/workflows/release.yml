name: Release

# Pushing a tag v<version> that matches <Version> in src/ShieldLabs/ShieldLabs.csproj builds, tests,
# packs and publishes the package. Re-running the workflow is safe: versions that are already on
# nuget.org are skipped.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Check that the tag matches the package version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/ShieldLabs/ShieldLabs.csproj)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release -warnaserror

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack src/ShieldLabs -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-package
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: build
    runs-on: ubuntu-latest
    # Configure required reviewers for this environment in the repository settings.
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing and the provenance attestation
      attestations: write # provenance attestation of the package
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nuget-package
          path: artifacts

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/*.nupkg'

      # Trusted publishing: exchanges the workflow's OIDC token for a short-lived API key.
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the .nupkg together with its .snupkg symbol package.
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
